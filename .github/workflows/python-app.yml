name: Python Tests

on:
  # Run the workflow whenever we push to the main branch.
  push:
    branches: ["main"]

  # Also run it whenever a Pull Request targets main.
  pull_request:
    branches: ["main"]

jobs:
  test:

    # GitHub will provide a temporary Ubuntu computer.
    runs-on: ubuntu-latest

    steps:
      # Download our repository onto the GitHub computer.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install the testing tools.
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Run our automated tests.
      - name: Run tests
        run: |
          pytest
